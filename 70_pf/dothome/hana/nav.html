<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>



/* head */
header {
    width: 200px;
    height: calc(100vh - 120px);
    background: #000;
    padding: 30px;
}
.main>li>a {
    position: relative;
    display: block;
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    border-bottom: 1px solid #111;
    background: lavenderblush;
    padding: 8px 0;
}
.main>li>a:hover {
    color: #fff;
}
.main li:hover .sub {
    z-index: 1;
    left: 160px;
    visibility: visible;
    opacity: 1;

}
.sub {
    z-index: -
    1;
    position: absolute;
    left:100px;
    width: 160px;
    visibility: hidden;
    /* visibility와 display:none은 전환효과가 적용되지 않는다. */
    top: 0px;
    opacity: 0;
    background: #000;
    transition: .5s;
    line-height: 2;
    padding: 10px 0; 

}
.sub li a {
    display: block;
    text-align: center;

}
    </style>
</head>
<body>
    <header></header>
</body>
</html>
