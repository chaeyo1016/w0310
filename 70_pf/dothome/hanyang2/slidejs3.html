<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>페이드 슬라이더</title>
    <style>
        #slider {
            width: 300px;
            height: 200px;
            position: relative;
            overflow: hidden;
            margin: 0 auto;
            border: 2px solid #ccc;
        }

        #slider img {
            position: absolute;
            top: 0;
            left: 0;
            width: 300px;
            height: 200px;
            display: none;
        }

        #slider img:first-child {
            display: block;
        }
    </style>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>

    <div id="slider">
        <img src="https://picsum.photos/id/1060/300/200" alt="Image 1">
        <img src="https://picsum.photos/id/1061/300/200" alt="Image 2">
        <img src="https://picsum.photos/id/1062/300/200" alt="Image 3">
    </div>

    <script>
        /* 1.객체
        2.속성: length -> 객체의 개수
        3.효과 메서드
        hide()->사라진다
        show()->나타난다.
        
        
        4.함수
        5.*/
        $(function () {
            var current = 0;
            // const images = $('#slider img');
            // const total = images.length;

            setInterval(function () {
               $('#slider img').eq(current).fadeOut();
                current = (current + 1) % 3;
                 $('#slider img').eq(current).fadeIn();
               
            }, 2000);
        });
    </script>

</body>

</html>
