<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css:target popuo</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #fff;
            font: 15px/1.6 '돋움' , sans-serif;
            color: #333;
        }
        ul {
            list-style: none;

        }
        a {
            text-decoration: none;
            color:#333;
        }
        /* 팝업 레이어 */
        #popup {
            display: none;
            position: fixed;
            left:0;
            top:0;
            width: 100%;
            height: 100%;
            background: raba(0,0,0,0.5);
        }
        #popup:target {
            display: block;
        }

        /* 팝업창 */
        .popup_content {
            /* position: relative; */
            margin: 10% auto;
            padding: 20px;
            background: #fff;
            width: 500px;
            /* border-radius: 8px;
            text-align: center; */
            background: #ccc;
        }
        /* 닫기 버튼 */
        .out_btn {
            text-align: right;
            /* background: blue; */
        }
        .close_btn {
            
            display: inline-block;
            background: #333;
            color:#fff;
            padding: 4px 12px;
            margin-top: 15px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>공지사항</h1>
    <a href="#popup" class="open_btn">팝업 열기</a>
   >

    <!-- 팝업창1 -->
     <div id="popup">
        <div class="popup_content">
            <h1>제목</h1>
            <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Quas, itaque vero quos quae alias sit consequuntur recusandae accusantium exercitationem sapiente rerum laborum enim ut assumenda. </p>
            <div class="outer_btn"><a href="#" class="close_btn">닫기</a></div>
        </div>
    
     </div>

</body>
</html>
