<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @charset "utf-8";

/* 공통 */
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

ul {
    list-style: none;
}

body {
    font: 15px/1.6 '돋움', sans-serif;
    background: #fff;
    color: #333;
}

a {
    text-decoration: none;
    color: #333;
}



/* 헤더 */
header {
    /* position: relative;
    z-index: 1; */
    /* display: flex;
    justify-content: space-between;
    align-items: center; */
    background: #f0f0f0;
    width: 200px;
    height: 650px;
    padding-top: 30px 0;
}
        /* 내비게이션 */
.gnb {
    position: absolute;
    /* right: 20px; */
    width: 160px;
    /* height: 30px; */
    background: darkkhaki;
    text-align: center;
    margin: 30px auto;
}

/* 1depth: 메인메뉴 */
/* .gnb .main {
    display: flex;
    ;
} */

.gnb .main>li>a {
    display: block;
    width: 160px;
    height: 30px;
    line-height: 60px;
    font-size: 18px;
    font-weight: bold;
    background: #999;
    border-bottom: 1px solid #f0f0f0;
}

.gnb .main>li>a:hover {
    background: #1A4975;
    color: #fff;
}

.gnb .main:hover .sub {
    height: 150px;
}

/* 2depth: 서브메뉴 */
.gnb .sub {
    height: 0;
    overflow: hidden;
    transition: .3s;
    background: rgba(157, 170, 188, 0.5);
}

.gnb .sub::before {
    display: block;
    content: '';
    padding-top: 10px;
}

.gnb .sub>li>a {
    display: block;
    font-size: 14px;
}

.gnb .sub>li>a:hover {
    background: #474ead;
    color: #fff;
    text-decoration: underline;
}
    </style>
</head>
<body>
    
            <!-- 내비게이션 -->
            <nav class="gnb">
                <ul class="main">
                    <li><a href="#">해수욕장</a>
                        <ul class="sub">
                            <li><a href="#">해운대해수욕장</a></li>
                            <li><a href="#">송정해수욕장</a></li>
                            <li><a href="#">열린관광지</a></li>
                        </ul>
                    </li>
                    <li><a href="#">축제</a>
                        <ul class="sub">
                            <li><a href="#">모래축제</a></li>
                            <li><a href="#">빛축제</a></li>
                            <li><a href="#">테마여행</a></li>
                        </ul>
                    </li>
                    <li><a href="#">장산숲소개</a>
                        <ul class="sub">
                            <li><a href="#">장산숲체험</a></li>
                            <li><a href="#">유아숲체험</a></li>
                            <li><a href="#"></a></li>
                            <li><a href="#"></a></li>
                        </ul>
                    </li>
                    <li><a href="#">뉴스룸</a>
                        <div class="sub"></div>
                    </li>
                </ul>
            </nav>
       
</body>
</html>
