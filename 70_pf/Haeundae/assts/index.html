<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>체험전시관</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- A. 헤더 영역 -->
  <header>
    <div class="logo"><img src="https://via.placeholder.com/150x50?text=LOGO" alt="로고"></div>
    <nav class="main-nav">
      <ul>
        <li><a href="#">이용방법</a></li>
        <li><a href="#">이벤트</a></li>
        <li><a href="#">프로그램안내</a></li>
        <li><a href="#">공지사항</a></li>
      </ul>
    </nav>
  </header>

  <!-- B. 이미지 슬라이드 -->
  <section class="slider">
    <img src="https://via.placeholder.com/1000x350?text=슬라이드+이미지" alt="슬라이드">
  </section>

  <!-- C. 콘텐츠 3단 영역 -->
  <section class="content">
    <div class="box notice">
      <h3>공지사항</h3>
      <ul>
        <li><a href="#popup1">[공지] 6월 체험 예약 안내</a></li>
        <li><a href="#">[휴관 안내] 6월 15일</a></li>
        <li><a href="#">[안내] 온라인 예약 변경</a></li>
      </ul>
    </div>

    <div class="box gallery">
      <h3>갤러리</h3>
      <img src="https://via.placeholder.com/100x100?text=1" alt="">
      <img src="https://via.placeholder.com/100x100?text=2" alt="">
      <img src="https://via.placeholder.com/100x100?text=3" alt="">
    </div>

    <div class="box quick">
      <h3>바로가기</h3>
      <a href="#">온라인예약</a><br>
      <a href="#">자료실</a>
    </div>
  </section>

  <!-- D. 푸터 -->
  <footer>
    <img src="https://via.placeholder.com/100x30?text=LOGO" alt="">
    <p>개인정보처리방침 | 이용약관</p>
    <p>&copy; 2025 체험전시관. All rights reserved.</p>
  </footer>

  <!-- 🎯 :target 레이어 팝업 -->
  <div id="popup1" class="popup">
    <div class="popup-inner">
      <h2>6월 체험 예약 안내</h2>
      <p>예약은 온라인을 통해 선착순으로 진행되며, 예약 완료 후 문자 안내를 받게 됩니다.</p>
      <a href="#" class="close">닫기</a>
    </div>
  </div>

</body>
</html>
