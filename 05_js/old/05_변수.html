<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>변수</title>
</head>

<body>
    <script>
        /* 
            변수란? 
                데이터를 담는 저장공간

            변수(variable) 선언 키워드
                var

            변수 이름 정의
                1. 띄어쓰할 수 없다. -> 한 단어로
                2. 첫 글자는 영문자, _, $
                3. 두 번째 글자부터는 영문자, _, $, 숫자 조합
                4. 예약어는 변수명x
                5. 카멜표기법(관례)

            변수 선언
                var 변수명;
            변수에 값 할당 
                변수명 = 값;
                -> 오른쪽의 값을 왼쪽 변수명에 할당한다.
                변수명 = 변수명;
                변수명 = 변수명 + 변수명;
                
                값 = 변수명; (x)
        */

        // 변수 선언
        var num;
        // 변수의 값 할당
        num = 10; // num에 10을 할당한다.

        // Uncaught SyntaxError: Invalid left-hand side in assignment
        10 = num; (x)

        // 변수 선언 및 할당
        var num1 = 100;
        
        // 여러 개의 변수를 ,로 연속하여 선언
        var num2, str, temp;
        num2 = 1000;
        str = "JavaScript"; /* 문자열(string) 데이터는 "" 또는 ''로 묶는다. */
        temp = "true"; /* true를 ""로 묶으면 문자열로 처리된다. */
        
        // 여러 개의 변수를 ,로 연속하여 선언 및 할당
        var str2 = '자바스크립트', temp2 = false;

        // 변수는 새로운 데이터가 저장되면 기존 데이터는 사라진다.
        num1 = 3000;
        num1 = 5000;
        num1 = 8000;

        // 출력
        console.log(num1);
        console.log(str);
        console.log(temp);
    </script>
</body>

</html>
