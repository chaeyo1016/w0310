<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>연산자</title>
</head>

<body>
    <script>
        /* 
            연산자
                1. 산술: +  -  *  /
                2. 비교: > < >= <=
                2. 비교: ==, === 같다.
                2. 비교: !=, !== 같지 않다.
                3. 논리: &&(그리고), ||(또는), !(아니다)
                3. 대입(할당): =
                4. 비트: &, |, ~, ^, <<, >>, ...
                5. 삼항: 피연산자1 ? 피연산자2 : 피연산자3 -> if문
                4. typeof
            
            비교 연산의 결과는 true 또는 false 이다.
            논리 연산의 결과는 true 또는 false 이다.

                1. 단항: 피연산자 1개 -> ++, --, !
                2. 이항: 피연산자 2개
                3. 삼항: 피연산자 3개
        */

        // 산술 ----------------------------------
        /* 
                +   더하기 또는 문자열 연결
                -   빼기
                *   곱하기
                /   나누기
                %   나머지
                ++  증가
                --  감소
        */
        var a = 5;
        var b = 2;

        // 덧셈
        document.write(a + b);
        document.write('<br>');
        // 문자열 연결
        document.write(a + '2');
        document.write('<br>');
        document.write(a - b);
        document.write('<br>');
        document.write(a * b);
        document.write('<br>');
        // 나눗셈
        document.write(a / b);
        document.write('<br>');
        // 나머지
        document.write(a % b);
        document.write('<hr>');
        // 1씩 증가(후위 연산) -> 출력 후 증가
        document.write(a++);
        document.write('<br>');
        document.write(a);
        document.write('<br>');
        // 1씩 증가(전위 연산) -> 증가 후 출력
        document.write(++a);


        document.write('<hr>');
        // 대입 ----------------------------------
        /* 
            =   오른쪽에 값을 왼쪽 변수에 대입
            +=  더한 후 대입
            -=  뺀 후 대입
            *=  곱한 후 대입
            /=  나눈 후 대입
            %=  나머지를 구한 후 대입
        */

        // NaN: Not a Number
        // ( ) -> 연산의 우선순위를 바꾼다.
        document.write(b + '<br>'); // b는 2
        document.write((a = b) + '<br>'); // a는 2
        document.write((a += b) + '<br>'); /* a = a + b -> a는 4 */
        document.write((a -= b) + '<br>'); /* a = a - b -> a는 2 */
        document.write((a *= b) + '<br>'); /* a = a * b -> a는 4 */
        document.write((a /= b) + '<br>'); /* a = a / b -> a는 2 */
        document.write((a %= b) + '<br>'); /* a = a % b -> a는 0 */

        document.write('<hr>');
        // 비교 ----------------------------------
        /* 
            >       초과(크다)
            <       미만(작다)
            >=      이상(크거나같다)
            <=      이하(작거나같다)
            ==      같다, 데이터 타입은 비교하지 않는다.
            ===     같다, 데이터 타입도 비교한다.
            !=      같지 않다, 데이터 타입은 비교하지 않는다.
            !==     같지 않다, 데이터 타입도 비교한다.

            비교 연산의 결과는 true 또는 false 이다.
        */
        document.write('a = ' + a + '<br>');
        document.write('b = ' + b + '<br>');
        document.write((a > b) + '<br>'); // false
        document.write((a < b) + '<br>'); // true
        document.write((a >= b) + '<br>'); // false
        document.write((a <= b) + '<br>'); // true

        document.write((a == b) + '<br>'); // false
        document.write((a === b) + '<br>'); // false
        document.write((a != b) + '<br>'); // true
        document.write((a !== b) + '<br>'); // true

        document.write('<hr>');
        document.write((2 == '2') + '<br>'); // true
        document.write((2 === '2') + '<br>'); // false -> 권장
        document.write((5 != '2') + '<br>'); // true
        document.write((5 !== '5') + '<br>'); // true -> 권장

        document.write('<hr>');
        // 논리 ----------------------------------
        /* 
            &&      피연산자의 연산 결과가 모두 true일 경우 true, 아니면 false
            ||      피연산자 연산 결과 중 하나 이상 true이면 true, 아니면 false
            !       피연산자의 연산 결과가 true이면 false, false이면 true

            주로 논리 연산자는 비교 연산자와 함께 사용한다.
            논리 연산의 결과도 true 또는 false 이다.
            숫자가 비교 또는 논리 연산에 사용될 경우 
                -> 0은 false로, 0이 아닌 숫자는 true
        */

        /* 
                연산자의 우선 순위
                    1. ()
                    2. ++, --, !
                    3. *, /, %
                    4. +, -
                    5. >, <, >=, <=
                    6. ===, !==
                    7. &&
                    8. ||
                    9. =, +=, -=, *=, /=, %=
        */

        document.write('a = ' + a + '<br>'); // false
        document.write('b = ' + b + '<br>'); // false
        document.write((-1 && 0) + '<br>'); // 0
        document.write((-1 || 2) + '<br>'); // -1
        document.write((a > b && a > b) + '<br>'); // false
        document.write((a > b || a > b) + '<br>'); // false
        document.write((!(a > b)) + '<br>'); // true

        var c = true;
        var d = false;
        document.write('<hr>');
        document.write((c && c && d && c && c) + '<br>'); // false
        document.write((c || d || d || d || d || d) + '<br>'); // true
        document.write((!c) + '<br>'); // false
    </script>
</body>

</html>
