<body>
    
    
    <script>
/* 
중단하다, 휴식 등의 뜻
continue (동사)




기타제어문
break문 - 중지 -> 제어문을 벗어난다.
continue문 - 건너뛰기

switch (표현식) {
    case 값1:
    코드1;
    [break;]
case 값2:
    코드2;
    [break;]
....
[default:
    코드;]
}



// 제어문 끝에는 ;를 찍지 않는다.

do {
    코드;
} while (조건식);
// 조건식이 항상 참 -> 무한루프에 빠진다.
while (true) {
코드;
}
*/


/* let i = 0;
while (true) {
    i++;
    console.log(i);
}
 */

 let flag = true;
 let i = 0;

 function looping() {
    while (flag) {
        document.write(`무한루프${i}<br>`);
        i++;
        if (i > 10) break;
        // break는 반복문인 while을 탈출한다.
    }
 }

 const limitNum = 5;
 let sum = 0;
 for (let i=1; i<=20; i++) {
    sum += i;
    if (i === limitNum) {
        break; //for문을 벗어남
    }
 }
 console.log(sum);

 for (let i = 1; i<=5; i++) {
    console.log(`난 바깥for${i}`)
    for (let j=1; j<=5; j++) {
        if (i === 2) {
            break;//안쪽 for만 탈출한다
        }
        console.log(`난 안쪽for${j}`); 


    }
 }

 /* 
 
 for (①초기값; ②조건식; 증감식) {
 ③코드1;
④continue; //아래 코드2 건너뛰기
 코드2;
}
 */
 sum = 0;
 let num = '3의 배수';
 for (let i = 1; i < 10; i++) {
    
if (i % 3 === 0) {
    num += i + '';
    continue;//if조건이 true이면 아래 코드인 sum +=를 건너뛴다.
}
sum += i;
i++;

 }
 console.log(num + '제외 총합 :' + sum );
    </script>
