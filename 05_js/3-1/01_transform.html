<!DOCTYPE html>
<html lang="en">
<head>

    <title>transform</title>
    <style>
    p {
        width: 500px;
        padding: 15px;
        background:#78a;
        border: 5px solid #000;
        font: 21px times;
          
        
    }
        /* 
        2D -평면 -> x, y축
        3D - 입체 -> x, y, z축
        
        transform(변형)
        transform: translate(20px, 20px) -> 이동
        -> x축 20px, y축20px 이동

        transform: scale(w0.3, h1.3) -> 크기조절
        -> 너비
        transform: rotate(deg) -> 회전

        transtorm: skew(deg, deg) -> 기울기
        
        */
    </style>

</head>
<body>
    <p>Original</p>
    <p class="t1">translate(30px,20px)</p>
    <p class="t2">rotate(50deg)</p>
    <p class="fa-temperature-3">svale(0.7,1.3)</p>
    <p class="t4">skew(15deg,10deg)</p>
    <p class="t5">matrix(1, 0.5, 0.5, 1, 0, 0)</p>
</body>
</html>
