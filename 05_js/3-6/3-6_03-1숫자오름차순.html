    <!-- // 배열 생성
const info = [45, 11, 7, 32, 20, 19];

// sort() -> 오름차순 정렬
info.sort((a, b) => {
    // <0 -> a가 앞으로
    // >0 -> b가 앞으로
    // ===0 -> 위치변경 없음
    // 예) 
    // step1: a=11, b=45 -> a-b=-34 -> [11, 45]
    // step2: a=7, b=45 -> a-b=-38 -> [11, 7, 45]
    // step2: a=7, b=11 -> a-b=-4 -> [7, 11, 45]
    // ...
    return a - b; // 오름차순
    //return b - a; // 내림차순
});
// info.sort((a, b) => a - b);

// 오름차순 정렬
console.log('정렬결과: ' + info); // [7, 11, 19, 20, 32, 45] -->
