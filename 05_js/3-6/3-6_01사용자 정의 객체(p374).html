<body>
    <script>
/* 
제이쿼리
$(this)

예약어
true,false, if, else, for, while, do, break, continue, switch,
try, catch,  this,.....

객체(object)
데이터 값을 필요한 대로 만들어 사용
데이터 '이름: 값'의 쌍으로 이루어져 있다.
-> 이것을 속성(properties)이라고 한다.


객체유형
1.사용자 정의객체
객체 리터럴로 객체 생성
const 객체 = {
속성: 값,
메서드: function(){this.속성},
...};


객체 생성자 함수로 객체생성
function 함수명(매개변수1, 매개변수2,....) {
this.t속성1 = 매개변수1
this.속성2 = 매개변수2...
this.메서드 = function(){};
}

생성자 함수 호출
const 변수 = new 함수명(인자1 , 인자2,....);//생성자함수호출을 쓸때 new

객체참조
객체.속성;
객체.메서드;

클래스(ES6)-> 객체 지향 프로그래밍 언어

2. 내장 객체: window, document, console,.....

함수생성
function 함수(){
코드;
}

사용자 정의 객체 형식:
객체 리터럴로 객체 생성
 const 변수 =  {
 속성: 값,
 메서드: function(){},
 ...}



 
 변수 생성
 const  = '홍길동';
 변수 사용
 
 {변수1: 값1, 변수2: 값2,...}
 
 변수
 테이터 값을 하나 밖에 저장 못한다.
 const a = 1;
 let b = 2;
 */

// 객체생성
const person = {
name: '홍길동',
age: 20,
nationality:'한국',
aboutme: function(){
alert('헬로우');}
}

//객체 사용
// console.log(객체.속성);
console.log(person.name);//홍길동
// console.log(객체.메서드());
person.aboutme()//경고창 실행

2.
const info = {
    subject:'css',
    credit: 1,
    printOut: function() {
        //this는 info이다. -> 객체자신
    return this.subject + ',' + this.credit + '학점';

}
};
//객체사용
console.log(info.subject);//css
console.log(info.credit);//1
console.log(info.printOut());//css, 1


//객체 생성 후 객체 리터럴의 속성을 추가, 삭제, 변경(갱신)할수 있다.
//속성추가
//객체.속성 = 값
info.days = 20;
console.log(info.days);//20
//속성삭제
//delete객체.속성
delete info.credit;
console.log(info.credit);
//속성변경
info.printOut = function(){
    return this.subject + ',' + this.days + '일';
}
console.log(info.printOut());//css,20일

//심볼(Symbol) 데이터
const info2 = {
    subjectName: '자바스크립트',
    subjectName: '제이쿼리'
}
console.log(info2.subjectName);

const subjectName = Symbol();
const info3 = {
    [subjectName]: '자바스크립트',
    subjectName: '제이쿼리'
}
console.log(info3[subjectName] + ',' + info3.subjectName);//자바스크립트,제이쿼리


//생성자(Constructor) 함수로 객체 생성
//생성자 함수의 이름은 첫 글자를 대문자로 쓴다
//->사용자 정의 함수와 구별한다.

function Info(subject,credit) {
    //this는 함수를 통해 생성되는 객체를 가리킨다.
    this.subject = subject;
    this.credit = credit;
    this.printOut = function() {
    return this.subject + ',' + this.credit + '학점';
    }   
}
//객체생성
const sub1 = new Info('html', 1);
const sub2 = new Info('css', 2);

//객체참조
console.log(sub1.subject);//html
console.log(sub1.credit);//1
console.log(sub1.printOut());// html,1학점
console.log(sub2.subject);//css
console.log(sub2.credit);//2
console.log(sub2.printOut());// css,2학점

//속성추가
sub1.days = 20;
console.log(sub1);
//속성삭제
delete sub1.credit;
console.log(sub1);
//속셩변경
sub1.prientOut = function(){
    return this.subject + ',' + this.days + '일';
}

console.log(sub1.prientOut());
//sub1객체에 추가, 제거, 변경된 속성들은 sub1객체에만 적용되고,
//sub2객체의 속성에는 영향을 주지 않느다.
//->속성의 추가, 제거, 변겨을 모든 객체에 적요하려면
//->Info 생성자 함수안에 속성들을 수정해야 한다.

console.log(sub2);
console.log(sub2.days);
console.log(sub2.credit);
console.log(sub2.prientOut());

// 리터럴로 객체 생성하기
const circle = {
    color: 'yellow',
    diameter: 100,
    radius: function(){
        return this.diameter / 2;
    }
};

console.log(circle.color);
console.log(circle.diameter);
console.log(circle.raidus);
//생성자 함수만들기
function Triangle(b, h) {
    this.base = b;
    this.height = h;
    this.area = function() {
        return this.base * this.height / 2;
    }
}
//생성자 함수로 객체 생성하기
const triangle1 = new Triangle(15, 15);
const triangle2 = new Triangle(25, 10);

console.log(triangle1.base);//15
console.log(triangle1.height);//15
console.log(triangle1.area());//112.5
console.log(triangle2.base);//25
console.log(triangle2.height);//10
console.log(triangle2.area());//125
