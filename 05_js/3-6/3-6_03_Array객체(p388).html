    <script>
        /* 
        사용자 정의 객체
        const obj = {

        Array객체
     객체 리터럴 처럼 변수에 데이터에 값을 필요한 대로 저장할 수있다
     객체 리터럴은 데이터 값을 '이름:값'으로 저장하는 반면 
     저장된 값에 자동으로 index(0,1...)를 부여된다.

     배열생성
     const 변수 = [값1, 값2,...];
     배열참조
     변수[index]
     -> index는 0,1,2,...

     속성
     length
     -> 배열 값의 개수
     메서드
     concat()
     -> 배열연결
     slice()
     join()
     tostring()
     ->문자열로 변환
     shift()
     unshift()
     pop()
     push()
     splice()
     reverse()

     filter()

     제어문
     for~of(ES6)


     const arr = [
    10,

     function(){}

     []
     ....
     ];
     */

        //숫자생성
        const num1 = new Number(10);
        const num2 = 10;
        //문자열 생성
        const str1 = new String('javascript');
        const str2 = 'javascript';
        console.log(str2.length);//10

        //배열(array)생성
        const arr1 = new Array(10, 20, 'javascript', jQuery);
        const arr2 = [10, 20, 'javascript', jQuery];
        console.log(typeof num1);
        console.log(typeof num2);
        console.log(typeof str1);
        console.log(typeof str2);
        console.log(typeof arr1);
        console.log(typeof arr2);

        //배열참조
        console.log(arr1[0]);
        console.log(arr1[1]);
        console.log(arr1[2]);
        console.log(arr1[3]);

        //배열 생성
        const info = [45, 11, 7, 32, 20, 19];
        //삽입정렬, 버블정렬, 병합정렬,....
        //sort()
        info.sort(function (a, b) {
            //<0 -> a가 앞으로
            //>0 ->b가 앞으로
            //=== 0 -> 위치변경 없음
            //예)
            // step1: a=11, b=45 -> a-b=-34 -> [11, 45]
            // step2: a=7, b=45 -> a-b=-38 -> [11, 7, 45]
            // step3: a=7, b=11 -> a-b=4 -> [7, 11, 45]
            return a - b;//오름차순
            // return b - a;//내림차순

        });

        //오름차순 정렬
        console.log(info);//(6) [7, 11, 19, 20, 32, 45]

        console.log(info.toString());
        console.log(info.toString().split(','));


       

        const city = ['서울','대구','대전','부산'];
        for (let i in city) {
            console.log(i);
            console.log(city[i]);
        }
        for (let i of city) {
            console.log(i);
        }

        const person = {
            name: '홍길동',
            age: 20,
            isBig: false,
            printOut: function() {
                console.log(`나는 ${this.name}입니다.`);

        };

        printOut2: function () {

        };
        person.printOUt();

            console.log(person.name);
        }
