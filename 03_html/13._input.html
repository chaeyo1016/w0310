<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML</title>
</head>
<body>
    <!-- 5대 웹브라우저
    1.크롬134.v,엣지134.v, 오페라117.v
    2. 사파리5.v
    3.파이어 폭스137.v-->
    <!-- https://caniuse.com/ -->
    <h1>폼</h1>
    <h2>input의 태그의 23개 타입</h2>
    <!-- shift+alt+ 방향키 -->
    입력상자<input type="text"> 
    비밀번호<input type="password"> 

    <!-- 웹 양식에 추가적인 테이터를 포함시킬 경우 사용 -->
   DB용<input type="hidden"> 

    <!-- 버튼 -->
    전송<input type="submit" >
   취소 <input type="reset"> 
    버튼<input type="button"> 
    이미지<input type="image"> 
    파일첨부<input type="file"> 

    <!-- 여러개중 여러개를 선택가능 -->
    <input type="checkbox" >네모1
    <input type="checkbox" >네모2
   <input type="checkbox" >네모3

   <!-- 여러개중 하나만 선택가능  -->
    <input type="radio" >동그라미1
    <input type="radio" >동그라미2
    <input type="radio" >동그라미3
    

    검색<input type= "search"> 
    전화번호<input type="tel">
     <!-- 이메일<inpualt+클릭t type="email"> -->
    이메일<input type="email">
    웹주소<input type="utl">

<!-- 날짜/시간 -->
   1. <input type="date" >
    <!-- datetime-local을 사용하고, datetime는 사용하지 않는다. -->
   2. <input type="datetime" >
   3. <input type="datetime-local" >
   4. <input type="month" ><!--파폭137x , 원도우사파리5.x -->
   5. <input type="time" ><!--파폭137x , 원도우사파리5.x -->
   6. <input type="week" ><!--파폭137x , 원도우사파리5.x -->

<!-- 색 -->
    <input type="color" >

<!-- 범위 -->
    <input type="range" >

<!-- 스핀 버튼 -->
    <input type="number"> 

    
    
    
</body>
</html>
