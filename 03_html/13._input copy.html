<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML</title>
</head>
<body>
    <!-- 5대 웹브라우저
     1.크롬134.v,엣지134.v, 오페라117.v
     2. 사파리5.v
     3.파이어 폭스137.v-->
     <!-- https://caniuse.com/ -->
    <form action="from">
        <h1>폼</h1>
        <h2>input의 태그의 21개 타입</h2>
        <!-- shift+alt+ 방향키 -->
        <!-- 여러 줄 입력상자: 회칙, 글쓰기 -->
        
        <label for="">입력상자<input type="text"></label> <br>
        글쓰기<textarea name="" id=""></textarea><br>
        회칙<textarea name="" id="" rows="5" cols="30" readonly  style="width: 300px: height: 150px: resize:none;">회칙을 여기에 기록한다.</textarea><br>
        <!-- rows: 줄(행, 가로) 수
        cols:칸(열,column,세로),수
          -->
        비밀번호<input type="password"><br>

        <label for="search_box">검색</label> 
        <input type= "search"id="search_box"><br>
        전화번호<input type="tel"><br>
        주소
        <!-- select는 value는 서버로 전송될 값이다.          -->
         <!-- 태그명 속성="값"  속성명 selected, -->

        <select >
            <option value="">Seoul special city</option>
            <option value="" selected>gyeonggi-do</option>
            <option value="">충청도</option>
            <option value="">강원도</option>
            <option value="">전라도</option>
            <option value="">경상도</option>
            
        </select>
      
        이메일<input type="email"><br>
        웹주소<input type="utl"><br>
        <!-- 웹 양식에 추가적인 테이터를 포함시킬 경우 사용 -->
          
        
          
         
        <h2>관심분야</h2>
        <!-- 여러개중 여러개를 선택가능 -->
        <label ><input type="checkbox" name="chkgroup" >HTML</label>
        <label ><input type="checkbox" name="chkgroup" >css</label>
           <label ><input type="checkbox"  name="chkgroup">java</label><br>
        
           <!-- 여러개중 하나만 선택가능  -->
        <!-- alt+클릭 디증커서
         ctrl+alt+ 아래키 방향키
          -->
         name속성으로 그룹핑한다
         name의 속성값은 임의 지정(단, 의미있게)
         <h2>위 사항을 모두 확인 후 선택</h2>
        <label ><input type="radio" name="radiogroup" >동의함</label> 
            <label ><input type="radio"  name="radiogroup">동의하지 않음</label><br>
        
        
        
           
        
        <!-- 날짜/시간 -->
        <input type="date" >
        <!-- datetime-local을 사용하고, datetime는 사용하지 않는다. -->
        <input type="datetime" >
        <input type="datetime-local" >
        <input type="month" >
        <input type="time" >
        <input type="week" >
        
        
        <!-- 색 -->
        <input type="color" >
        
        <!-- 범위 -->
        <input type="range" >
        
        <!-- 스핀 버튼 -->
        <input type="number">
          <!-- 버튼은 용도에 맞게 사용해야 한다. -->
          전송<input type="submit" value= "전송" >
           취소<input type="reset"value="취소">
           버튼<input type="button"value="버튼"><br>
           <button>type="submit">전송</button>
           <input type="reset">"취소">
            <button>type="button></button>
        
        
    </form>
    
</body>
</html>
