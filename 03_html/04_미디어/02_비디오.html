<body>
    https://convertio.co/kr/mp3-wav/
    <!-- 속성
     src: 비디오 파일 경로
     autoplay: 자동 실행 
     muted: 음소거
     loop: 무한 반복
     controls:컨트롤 표시
     preload: 미리 로드방식
     auto: 일부 또는 전체를 미리 로드한다.
     metadata: 오디오의 메터테이터(길이, 제목 등 )만 미리 로드한다.
     none: 미리 로드하지 않음. 
      -->
    <!--
    8bit= 1byte
    2byte= 1word
    깃허브 1개 레파지토리: 2GB
     6,846kb-> 7M
     저장 용량: B(btye,바이트)
     1000byte=1KB
     1000KB= 1MB(메가)
     1000MB= 1GB(기가)
     1000GB=1TB(테라)-->
    

    <h1>비디오</h1>
    <!-- 파일 이름에 공백 사용하지 말것!!! -->
     <!-- autoplay하려면 muted 함께 사용해야 한다.-->
   <video class="vid1" src=./assets/3065047-hd_1920_1080_30fps.mp4  loop autoplay muted></video>
   <video  controls weigh="600" poster="./assets/비디오poster1691.jpg"   >
    <source src="./assets/3065047-hd_1920_1080_30fps.mp4" type="video/mp4">
    <source src="./assets/3065047-hd_1920_1080_30fps.webm" type="video/webm">
    <source src="./assets/3065047-hd_1920_1080_30fps.ogv" type="video/ogg">
   
     Your browser does not support the audio element (당신의 브라우저는
    오디오 요소를 지원하지 않습니다.)
</video>

 소스? 파라미터1&파라미터2...
 autoplay=               자동 재생 
 mute=1                 음소거(autoplay시 함께 사용!)
 loop=1                 반복 재생
 controls=0            컨트롤바 숨김
 start=30              재생 시작 
 modestbranding=1     유튜브 로고 최소화 
 rel=0                영상 종료시 다른 채널 영상 표시 방지 (같은 채널만 노출)
