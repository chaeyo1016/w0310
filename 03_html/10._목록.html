<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML</title>
</head>

<body>
    <!-- shi+alt+f: 자동들여쓰기 -->
    <h1>목록</h1>
    <!-- 순서없는 목록 -->
    <h2>음료 메뉴</h2>
    <ul>
        <li>커피
            <p>아래 메뉴는 우리회사에서 판매하는 커피 메뉴입니다.</p>
            <ul>
                <li>아이스 아메리카노</li>
                <li>카페모카</li>
                <li>카라멜 마끼야토</li>
            </ul>
        </li>
        <li>우유</li>
        <li>코카콜라</li>
    </ul>


    <!-- 순서있는 목록 -->
    <h2>커피 판매 순위</h2>
    <ol>
        <li>아이스 아메리카노</li>
        <li>카페모카</li>
        <li>카라멜 마끼야토</li>
    </ol>

    <!-- 
     설명 목록 (definetion list) -> dl
     설명 항목 (descroption term)-> dt
     설명 목록의 설명 description description ->dd
      -->
     <h2>약어 정의</h2>
     <dl>
        <dt>HTML</dt>
        <dd>페이지의 <i>구조와 내용<i>을 정의하는 언어이다.</dd>
        <dt>css</dt>
        <dd>css는 cascading style sheets 약자로 HTML,XML 등의 문서의 <b>스타일을 지정(디자인)</b>스타일
            지정하는 언어이다.
        </dd>
     </dl>

</body>

</html>
