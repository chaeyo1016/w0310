<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>animation</title>
    <style>
        /*
        개별속성
        animation-name: 애니메이션 이름(본인마음);
        값: none(없음)
        알파벳,숫자,-(하이픈),_(언더스코어)
        animation-duration: 애니메이션 지속시간;
        값:->단위: 1s(1초)
        animation-iteration-count: 반복횟수;
        값: 숫자,infinite(무한반복)

        animation-diirection:방향;
        값: normal(기본값)-(정방향)
            reverse-(역방향)
            alternate-(양방향 반복)
        animation-delay:지연시간;
        값: 1s->단위: s(초)
        animation-timing-function: 가속도;
        값: ease(기본값)-처음에 느리고, 중간에 빠르고,끝에 느리게
            ease-in-처음에 느리고, 끝에 빠르게
            ease-out-처음에 빠르고, 끝에 느리게
            ease-in-out-처음과 끝이 느리고, 중간은 빠르게 (처음과 끝이 동일하게 느리게)
            linear(등속)
        animation-fill-mode: 종료 후 속성 상태;
        값: none(기본값)-애니메이션 종료 후 아무런 스타일 변화가 없음
            forwards-에니메이션 끝난후 마지막 상태 유지
            backwards-애니메이션 시작 전 적용된 스타일 유지
            both-애니메이션 종료 후와 시작 전 속성 유지

        animation-play-state: 애니메이션 재생상태;
        값: running(기본값)-재개
            paused-일시정지

        */
        
        /* 속기 속성
        -animation: 이름 동작시간 [반복횟수] 대기시간 방향 속도 상태;
         요소가 한 스타일에서 다른 스타일로 점진적으로 변경할 수 있도록 한다.
         
         애니메이션의 작업 단위? 키프레임 (keyframe)
         
         -@keyframes 애니메이션이름 {
         from {속성: 값;....}
         to {속성: 값;...*/
         /* @keyframes 키워드애니메이션이름 {
         0% {속성: 값;....}
         50% {속성: 값;...}
         50.99999% {속성: 값; ...}
         100% {속성: 값;...}
         */  

         div {
            position: absolute;
            width: 100px;
            height: 100px;
           background: red;
           animation-name: right_move;
           animation-duration: 5s;
           animation-delay: 3s;
           /* alternate뜻? 번갈아가며, 교대로 */
           animation-direction: alternate;
           animation-timing-function: linear;
           animation-iteration-count: 3;
           /* animation-iteration-count: infinite; */
              animation-fill-mode: forwards;/* 왔다가 멈춤 */
         }
         @keyframes right_move {
            /* 시작 */
           from {left:0}
           /* 종료 */
           to {left: 1000px}
            
         }
         @keyframes right_move2 {
            /* 시작 */
           0% {left:0}
           50% {left: 1000px;}
           /* 종료 */
           100% {left: 0px}
            
         }
    </style>
</head>
<body>
    <div class="div1">박스</div>
</body>
</html>
