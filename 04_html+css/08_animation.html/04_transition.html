<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>transition:전환</title>
    <style>
        /* 
        transition은 
        지정한 시간동안 부드럽게 속성(opcite,을 전환한다.

        참고로 display, position, z-index, overflow,visibility,font-family, box-sizing,...은 적용되지 않는다.

        개별속성
        transition-property: all;
        transition-duration:0s(단위: 초)
        transition-timing-function
        값: 가속- ease(기본값):느림-빠름-느림 -> cubic-bezier(0.25,0.1,0.25,1)
                  ease-in:느림-빠름 -> cubic-bezier(0.42,0,1,1)
                  ease-out:빠름-느림 -> cubic-bezier(0,0,0.58,1)
                  ease-in-out: 느림-빠름-느림 -> cubic-bezier(0.42,0,0.58,1)

            등속 - linear
            cubic-bexier(n,n,n,n)-> n은 0~1 사이 값
            cubic-bezier(x1,y1,x2,y2) -> xdms 0~1 사이 값, y는 음수, 1이상 가능
        transition-delay: 0s(단위: 초)


        속기속성
        transition: property duration timing-function delay;
                    ([속성명] 전환시간 [가속도] [지연시간];)
        */
        li {
            list-style:none
        }
        a {
            display: block;
            width: 300px;
            margin-bottom: 2px;
            padding: 30px 20px;
            text-decoration: none;
            background: #abd;


            /* transition-duration:1s; */
            transition-property: width,color;
            transition-duration: 1s, 1s;

            transition: width 1s, color 1s;

            transition:all 1s;
            transtition: 1s;
        }
        a:hover {
            width:450px;
            color:red;
        }
    </style>
</head>
<body>
    <h1>Moving Menu</h1>
    <ul class="menu"></ul>
    <li><a href="#">Comany</a></li>
    <li><a href="#">Product</a></li>
    <li><a href="#">Service</a></li>
    <li><a href="#">Customer Support</a></li>
    <li><a href="#">Community</a></li>
</body>
</html>
