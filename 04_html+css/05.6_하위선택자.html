<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML+CSS</title>
    <style>
        /* 태그 (탕ㅂ, 요소) 선택자 */
        p{color: blue;}
        /* 하위 선택자-> 선택자를 공백으로 구분
        선택자1 선택자2
        조상 자손
        조상은 부모도 포함된다.
        하위는 자식과 손자 모두를 가르킨다.
        자손은 자식+손자 
        자손은 자식도 포함된다.*/
        /* div의 . abox요소의 자손p를 선택하여 */
        div.abox p
        /* 클래스 이름이 abox요소인 자손p를 선택하여 */
        .abox p {color: rgba(231, 11, 11, 0.822);}
    </style>
</head>
<body>
    <div class="abox">

        <p>div의 첫번째 자식p</p>
        <p>div의 두번쩨 자식p</p>
        <ul>
            <li><p>li의 첫 번째 자식p</p></li>
            <li><p>li의 두 번째 자식p</p></li>p
            
        
        </ul>
    </div>
    <p>body의 자식</p>
</body>
</html>
