<head>

    <title>가상 요소 선택자</title>
    <style>
       p: first-letter {
            font-size: 150%;
                }
        
        p:after {
            content: "★";
       }
        p:before {
            content: "★";
        }
        .box:aftter {
            content: "항목을 선택해주세요";
            color: red;
        }
    </style>
</head>
<body>
   <div class="box">
    <p>Company</p>
    <p>product</p>
    <p>seyvice</p>
    <p>community</p> 
</body>
