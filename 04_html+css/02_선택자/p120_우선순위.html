<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>선택자의 우선순위</title>
    <style>
        /* 
        선택자의 우선순위
        1.!inportant -> 키워드->가능한 사용하지 않는다
        2.인라인 -> 지정방식 -> 가능한 사용하지 않는다.
        3.id
        4.class, 가상 class, 속성
        5.요소, 가상 요소
        id>class>태그(요소)

        같은 우선 순위를 가진다면 아래 기록한 내용이 적용된다. 
        */




        /* id선택자가 태그 선택자보다 우선순위가 높다 */

        #ctxt {color: red;}
        p {color: pink;}
        p {color:blue;}
        p.atxt {color:green !important;}
        p.atxt.btxt {color: yellow;}
        p:first-child {color:red;} 
        /* ->가상클래스이다(first-child) */

    </style>
</head>
<body>
    <!-- 인라인 스타일이 내부스타일보다 우선한다. -->
     <!-- HTMl의 속성 간 순서없다. -->
    <p id="ctxt" class="atxt btxt" style="color: green;">
    선택자의 우선순위
    </p>
    <p>선택자의 우선순위2</p>
</body>
</html>
