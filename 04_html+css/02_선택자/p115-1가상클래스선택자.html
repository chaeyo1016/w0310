<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가상 클래스 선택자</title>
    <style>
        /* 
            가상 클래스 선택자(:) - 사용자 인터랙션
               a: link -> 기본색: 파랑
               a: visited ->방문후: 보라색
                /* :hover -> 올렸을때 : 파랑 */
                :active -> 눌렀을때 :빨강
                :focus -> 
            
            가상 클래스 선택자(:) - 위치 기반 -> 형제 관계(+, ~)
                :first-child
                :last-child
                :nth-child(n)
                :nth-last-child(n)
                :only-child

                :first-of-type
                :last-of-type
                :nth-of-type(n)
                :nth-last-of-type(n)
                :only-of-type

            가상 요소 선택자(:: 또는 :)
                ::first-letter -> 요소의 첫 글자
                ::first-line -> 요소의 첫 줄
                ::before -> 요소 안 맨 앞에 배치될 요소
                ::after -> 요소 안 맨 뒤에 배치될 요소
        */

        a:link {
            color:lightcoral;
        }
        a:visited {
            color:lightgreen;}
           a :hover {color:lightgray;}
           a :active {color:orange;}
         
            a:hover {
            color: rgb(55, 53, 53);
            font-size: 24px;
        }
        /* p76 (포커스)
        tab키로 이동시 포커스를 받는 요소
        note부분참고*/
        /* 포커스를 가지면 테두리 빨강, 글자색 파랑 */
        /* 논리적으로 마크업한 이동 순서에 영향을 줄 수 있기 때문에 */
        /* 주의해서 사용한다.!!! */

               /* 
         tabindex 속성
        1: 가장 먼저 포커스를 받는다
        0: 포커스를 갖지 않는 요소에 포커스를 적용
        -1: 포커스를 갖는 요소에 포커스를 적용 */



        :focus {
            border: 1px solid red;
            color:blue;
        }
    </style>
</head>

<body>
   
    <ul>
        <li><a href="https://naver.com">네이버</a></li>
        <li><a href="httoa://google.com" tabindex="1">구글</a></li>
        <li><a href="https://nate.com">네이트</a></li>
      
    </ul>
    <p>:hover와:active는 다른 요소도 적용된다.</p>
</body>

</html>
