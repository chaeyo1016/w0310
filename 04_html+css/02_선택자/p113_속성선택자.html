<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>속성 선택자</title>
    <style>
        /* 
            속성 선택자 
                [속성]
                [속성="값"]

                [속성^="값"]  : 값이 "값"으로 시작하는 속성
                [속성$="값"]  : 값이 "값"으로 끝나는 속성
                [속성*="값"]  : 값에 "값"이 포함된 속성

                [속성|="값"]  : 값이 "값"으로 시작하고 "-"로 구분된 속성
                [속성~="값"]  : 값이 "값"으로 포함된 속성
        */

        [title] {color: blue;}
        [title="icox"] {color: red;}

        /* 값으로 시작하는 */
        [title^="icox"] {color: green;}
        [title$="icox"] {color: orange;}
        /* 값을 포함하는 */
        [title*="icox"] {color: purple;}

        /* 값으로 시작하는 */
        /* [title|="icox"] {color: brown;} */
        /* 값을 포함하는 */
        [title~="icox"] {color: pink;}
    </style>
</head>
<body>
    <h3 title="logo">서울특별시</h3>
    <h3>경기도</h3>
    <p title="icox">icox</p>
    <p title="icoxpage">icoxpage</p>
    <p title="screenicox">screenicox</p>
    <p title="I icox U">I icox U</p>
    <p title="icox-1">icox-1</p>
</body>
</html>
