<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>속성선택자</title>
    <style>
        /* 
            속성선택자
            [ 속성]
            선택자[class]
            선택자[title]
            선택자[속성="값"]   
            [속성^="값"]  : 속성이 값으로 시작하는 경우 
                   */
        
        [title] {color:blue;}
        [class="icox"] {color:red;}

        /* 값으로 시작하는 */
        p[class^="icox"] {color:green;}
        p[class="icox"] {color:orange ;}
             /* 값으로 포함하는 */
         p[class^="icox"] {color:purple;} 
         /* 값을 포함하는 */
         [class*="icox"] {color:pink;}     




    </style>

</head>
<body>
    <h3 class="logo" title="logo">서울특별시</h3>
    <h3>경기도</h3>
    <p class="icox" title="logo">icox.</p>
    <p class="icoxpage">icoxpage.</p>
    <p class="screenicox">screenicox.</p>
    <p class="I icox U">icox-1.</p>
</body>
</html>
