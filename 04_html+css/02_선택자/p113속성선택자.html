<!DOCTYPE html>

<head>

    <title>속성선택자</title>
    <style>
        /* 
            속성선택자
            [html 속성]
            선택자[class]
                   */
        
        [title] {color:blue;}

    </style>

</head>
<body>
    <h3 class="logo" title="logo">서울특별시</h3>
    <h3>경기도</h3>
    <p class="icox" title="logo">주소록을 작성합니다.</p>
    <p class="icoxpage">전화번호를 작성합니다.</p>
    <p class="screenicox">건강기록부을 작성합니다.</p>
    <p class="I icox U">금전출납부를 작성합니다.</p>
</body>
</html>
