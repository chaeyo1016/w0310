<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>box-sizing</title>
    <style>
        /* * {margin: 0; padding: 0;} */
        body,p,ul {margin: 0;}
        ul {padding: 0;}
          
        /* 영역을 확인할때는 outline을 쓰면 좋다 */
        body * {outline: 1px dotted red;}
        p {
        width: 600px;
        height: 100px;
        padding: 30px;
        border-bottom: 5px solid rgba(0, 0, 0, 0.1);
        margin-bottom: 10px;
        background: rgba(0, 0, 255, 0.1);
        
        }
        ul {
            
        }
        /* .sizing { */
            /* height를 넘어서면 border-box한 의미가 없다 */
        /*     box-sizing:border-box;/* bxb */
       /*  } */ 
       /*  .sizing_list {
            width: 500px;
            margin-top: 20px;
        } */


        li {
         /*   /*  /* 개별속성 */
            /* list-style-type: none; *//* lstn */
            /* 속기속성 */ 
           /*  float:left;자기자신한테 */
           width: 25%
            list-style: none;
            background: rgba(0, 0, 255, 0.1);
            text-align: center;
            padding: 10px;
            /* box-sizing:border-box;는 widgh, height와 함께 사용한다. */
            box-sizing: border-box;

        }
        li:nth-dhild(even) {
            background: rgba(0, 0, 255, 0.1);
        }
        a {
            text-decoration: none;
            color: black;
        }
        a:hover {
            color: red;
        }


    </style>
</head>
<body>
   <p>Lorem ipsum dolor sit amet consectetur adipisicing elit.</p>
   <p class="sizing">Lorem ipsum dolor sit amet consectetur adipisicing elit. Assumenda minus recusandae expedita voluptate porro eveniet.</p>
   <ul>
    <li><a href="#">Company</a></li>
    <li><a href="#">Sservice</a></li>
    <li><a href="#">Custommer</a></li>
    <li><a href="#">Community</a></li>
   </ul>
</body>
</html>
