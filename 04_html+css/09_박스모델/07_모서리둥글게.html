<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>border-radius</title>
    <style>
        div {
            width: 200px;
            height: 200px;
            background: green;
            /* 가로 또는 세로 크기의 1/2이상 지정하면 원 또는 타원 */
            /* 1/2이하의 크기면 둥근사각형 */
            border-radius: 50px;
        }
    </style>
</head>
<body>
    <div>박스</div>
</body>
</html>
