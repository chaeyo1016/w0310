<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>padding</title>
    <style>
        * {margin: 0; padding: 0}/* 바람직하진 않다 */
        body, h1, p {margin: 0px;}/* 실용적용이다 */
        /* 

        개별 속성
        margin-top
        margin-right
        margin-bottom
        margin-left
        
        
        속기 속성
        margin: 상;
        margin: 상하 좌우;
        margin: 상 좌우 하;
        margin: 상 우 하 좌;
        
        */

        p {
            background: rgb(159, 215, 250 ,0.5);
            width: 700px;
            margin-top: 20px;
            margin-bottom: 20px;
            margin-left:20px;
            margin-right:20px;

            margin: 20px;

        

         
            /* 상하는 50, 좌우는 70 */
            margin: 50px 70px;
        }
        .center {
            /* auto는 젠체 가로크기에서 요소크기를 뺀 나머지를 좌우에 귵등하게 처리한다.->자동(auto)으로
            남은 여백의 반으로 계산하여 배치 */
            margin: auto;
        }
        p:nth-of-type(2) {
            margin-top: -68px;
        }
    </style>
</head>
<body>
    <h1>margin</h1>
    <!-- 블록레벨 요소의 상하 margin은 큰 쪽으로 지정된다. -->
    <p>패딩은 요소의 안쪽의 여백을 말한다.</p>
    <p>패딩의 값은 숫자(단위)로 지정한ㄷ. (단, 음수는 지정할 수 없다)</p>
    <p class="center">가로 가운데 맞춤합니다.</p>
</body>
</html>
