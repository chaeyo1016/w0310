<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>padding</title>
    <style>
        /* 
        
        개별 속성
        padding-top
        padding-right
        padding-bottom
        padding-left
        
        
        속기 속성
        padding: 상;
        padding: 상하 좌우;
        padding: 상 좌우 하;
        padding: 상 우 하 좌;
        
        */

        p {
            background: rgb(159, 215, 250 ,0.5);
            width: 600px;
            padding-top: 50px;
            padding-bottom: 50px;
            padding-left:70px;
            padding-right:70px;

        

         
            /* 상하는 50, 좌우는 70 */
            padding: 50px 70px;
        }
    </style>
</head>
<body>
    <h1>padding:요소의 안쪽여백</h1>
    <p>패딩은 요소의 안쪽의 여백을 말한다.</p>
    <p>패딩의 값은 숫자(단위)로 지정한ㄷ. (단, 음수는 지정할 수 없다)</p>
</body>
</html>
