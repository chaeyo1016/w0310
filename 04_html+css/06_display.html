<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML+CSS</title>
    <style>
/* 

display:화면에 표시되는 방식
 1.block
 -줄바꿈o
 -width는 부모width크기의 100%
 -height는 콘텐츠 크기
 -width와 height를 지정O
 -margin은 상하좌우 모두 적용

 2.inline
 -줄바꿈x
 -width와 height를 지정x
 -margin은 좌우만 적용
 3.inline-block
 -인라인이면서 블록 특징을 가진다
 -줄바꿈x
 -width는 부모width크기의 100%
 -height는 콘텐츠 크기
 -width와 height를 지정O
 -margin은 상하좌우 모두 적용

 4.none:없음 */

 div{
    width: 300px;
    height: 50px;;
    border: 1px solid #000;
    padding: 10px;
    /* 위아래 여백의 경우 겹치면 큰 쪽으로 지정된다. */
    margin: 20px;
    background: lightpink;
 span{
    display: inline-block;
    /* width와height가 지정되지 않는다. */
    width: 300px;
    height: 50px;
    border: 1px solid #000;
    padding: 10px;
    /* 위아래는 적용되지 않는다 */
    /* 위아래는 적용되지 않는다 */
    margin: 20px;
    background: lightgreen;

}
     
    }
   

    /* display: inline; */
 }
    
     </style>
</head>
<body>
    <!-- 
    요소(Elenent)
1.블록 레벨 요소:
-줄 바꿈
- div....
2.인라인 요소 : 
-줄바꿈x
-span,...
 -->
<!-- div는 display: block, -->
  <div>div박스</div>
  <div>div박스</div>
  <!-- span는 display: inline, -->
  <span>span박스</span>
  <span>span박스</span>
</body>
</html>
