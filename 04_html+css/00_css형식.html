<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML+CSS</title>
    <style>
        p {
            width: 50%;
            color: red;
            background: blue;
        
        }
        


    </style>
</head>

<body>
    <h1>CSS기본형식</h1>

    <p>%단위는 상대적 단위(기준이 필요)이다.</p>

</body>

</html>
