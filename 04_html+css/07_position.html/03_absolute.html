<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>position:absolute;</title>
    <style>
        body {
            margin: 0;
        }
        .wrap {
            display: flex;
            height: 850px;
        }
        header {
            width: 200px;
            background: yellow;
        }
        .container {
            width: calc(100% - 200px);
        }
        .slide {
            height: 400px;
            background: orange;
        }
        .contents {
            height: 450px;
            background: lightblue;
        }
        .link {
            position: absolute; /* posa */
            top:0;
            right:0;
            width: 120px;
            height: 300px;
            background: lightcoral;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <header>헤더</header>
        <div class="container">
            <div class="slide">이미지</div>
            <div class="contents">
                <div class="link">링크</div>
            </div>
        </div>
    </div>
</body>
</html>
