<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>position</title>
    <style>
        /* 
            position(퍼지션, 위치, layout(배치)하다) 속성
                뜻: 요소의 위치 지정
                값: 
                    - static(기본값)
                    - relative: 자기 자신 기준

                    - absolute: 부모(조상) 기준
                    - fixed: 창(뷰포트) 기준

                absolute와 fixed는 width가 요소 크기로 지정된다.

                fixed는 상단 고정 내비 제작시 사용된다.

                absolute도 부모(조상) 중에 position 값이 static이 아닌 요소가 없으면 fixed와 같이 창(뷰포트) 기준이다.

                static과 relative의 차이는 left, top, right, bottom, z-index 5가지 속성의 적용 유무에 있다.

                static을 제외하고 relative, absolute, fixed일 경우 left, top, right, bottom, z-index 5가지 속성을 지정할 수 있다.


            top
            left
            right
            bottom

            z-index                                
        */
        body {
            margin: 0px;
            height: 2000px;
        }
        .parent {
            /* width: 200px; */
            height: 200px;
            background: yellow;
        }
        .child {
            position: fixed;
            width: 100%;
            left:0px;
            top:0px;
            height: 100px;
            background: red;
        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="child"></div>
    </div>    
</body>
</html>
