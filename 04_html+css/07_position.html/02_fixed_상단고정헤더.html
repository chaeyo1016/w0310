<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상단 고정 헤더</title>
    <style>
        body {
            margin: 0px;
        }
        header {
            /* 상단 고정 헤더 */
            position: fixed;
            width: 100%;
            left:0px;
            top:0px;
            height: 100px;
            background: darkolivegreen;
        }
        section {
            height: 900px;
            background: lightcoral;
        }
        section:nth-of-type(2n) {
            background: lightblue;
        }
        footer {
            background: #ccc;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>
    <header>헤더</header>
    <section>1</section>
    <section>2</section>
    <section>3</section>
    <section>4</section>
    <footer>푸터</footer>
</body>
</html>
