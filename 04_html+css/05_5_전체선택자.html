<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML+CSS</title>
    <style>
/*  선택자의 종류
1.기본(simple) 선택자
2.결합자 (combinator) 선택자
3.의사클래스(슈도, 유사,pseudo-class 선택자
4.의사요소(슈도, 유사,pseudo-elements) 선택자
5.속성(Attribute) 선택자 */

/* 
1.기본 선택자
2.elment(type, tag) - 태그 이름을 로 사용! */
3. class  - .이름, 여러번
4. id  - # 이름,한번만
5. 그룹  - ,(콤마)
6. 전체  - *(별표)

p {color:  red;
}
/*  id와 class의 이름 규칙
1. 첫 글자는 숫자 x
2. 주로 영문자 
3. 특수문자는 _와 -사용 가능*/

/* 
*는 전체 -> html */
html{border: 5px solid lightblue;}
body{border: 5px solid lightblue;}
h1{border: 5px solid lightblue;}
h2{border: 5px solid lightblue;}
p{border: 5px solid lightblue;}

html, body, h1,h2,p{border: 5px solid lightblue;}
html, body, div,ul,p{border: 5px solid lightblue;}


body *{border: 5px solid lightblue;}

/*  */

h1, .h2, .p{
    border: 5px solid lightblue;
}

/* 
*{선언부} 
선택자 *{선언부}*/
</style>
</head>
<body>
    <h1>선택자</h1>
    <h2>요소(타입, 태그) 선택자</h2>
    <p> Lorem ipsum dolor sit amet  </p>
   
   
    
    
</body>
</html>
