<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>display:flex</title>
    <style>
        .flexbox {
            /* 
            가로배치
            display: flex; 부모 요소에 지정하면 부모는 플렉스 컨테이너가되고,
            자식요소는 플렉스 아이템이 된다. 그리고, 플렉스 아이템은 가로배치된다.



             */
            display: flex; /* df */
            /* row: 행 -> 가로, colum: 열 -> 세로 */
            flex-direction: row; /* fxd */
            /* 플렉스 아이템의 높이가 부모 크기만큼 늘어난다. */
            align-items: stretch;
            background: #ccc;
            height: 200px;
        }
        .flexbox  div {
            background: darkcyan;
            margin: 10px;
        }

/*             
            
            flex-direction: row; -> 주축이 가로
            justify-content ->(주축)가로
            align~ -> 세로
            flex-direction: column; -> 주축이 세로
            align~ ->주축(가로)
            justify-content ->(교차축(세로)

            맞춤(정렬)-> 주축/교차축 정렬
            justify-content
            ->값: flex-start, flex-end, center
            space-betweeen, space-around, space-evenly

            align-content
            값:stretch, flex-start, flex-end,center
             space-betweeen, space-around, space-evenly

            align-items
            값: stretch,flex-start,flex-end, center,baseline
            
            align-self/* 자식에 적용하면서 자신이적용 */
            /* 값: auto, stretch,flex-start, flex-end, center,baseline
           
             */ 


    </style>
</head>
<body>
    <!-- 블록레벨 요소(div)는 세로배치 -->
     <!-- 자식요소는 내용크기만큼 커진다(인라인처럼) -->
    <div class="flexbox">
        <div>1</div>
        <div>2</div>
        <div>3</div>
    </div>
</body>
</html>
