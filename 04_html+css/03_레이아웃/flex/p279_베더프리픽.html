<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- 어떤 요소에 display: flex;를 지정하면 그 요소는 플렉스 컨테이너가 되고 -->
    <!-- 자식요소는 플렉스 아이템이 된다 -->

    <!-- 플렉스 컨테이너에 지정가능한 속성
    display: felx;
    felw -->
  
    <!-- 플렉스 컨테이너 -->
    <!-- 
    flex-direction  + flex-wrap=flex-flow
    justify-content 
    align-items 
    align-content  -->

    <!-- 플렉스 아이템 -->
      <!-- 
        align-self - 정렬                
        flex-grow + flex-shrink + 
        flex-shrink - 수축
        flex-basis - 가로 크기 초기값
        order - 자식 요소 순서
        flex -->
    <style>
        .flexbox{
            /* 가로배치: width가 자식 크기 , height는 부모크기의 100%*/
            display: flex;
            height: 200px;
            background: #ccc;
        }
        .flexbox > div {
            background: darkcyan;
            margin: 10px;
            /* flex: 0 1 auto; */
            flex-grow: 1;
            flex-shrink: 0;
            flex-basis: 1;
        }
    </style>
<body>
    <div class="flexbox">
        <!-- 블록레벨요소는 width는 부모 크기의 100%이며,
         줄바꿈되기 때문에 세로 (위에서 아래로)배치된다.
         height는 자식 크기만큼 지정된다. -->
    
         <div>flex-item</div>
         <div>flex-item</div>
         <div>flex-item</div>
         </div>
    
</body>
</html>
