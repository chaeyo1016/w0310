<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1,
        p,
        ul{
            margin: 0;
        }

        ul {
            list-style: none; /* 속기 속성 */
            padding-left: 0;
        }
         li {
            float: left;
            margin-right: 10px;
            width: 150px;
            text-align: center;
        }
        li:last-of-type {margin-right: 0;}
        li p {
            text-align: justify;
            word-break: break-all;
            padding: 10px;
            font-size: 14px;
        }

       h3 {
            padding: 5px;
        }

        li:nth-of-type(1)h3 {background:#daa;}
        li:nth-of-type(2)h3 {background: #abc;}
        li:nth-of-type(3)h3 {background: #eba;}
        li:nth-of-type(4)h3 {background: #aa7;}
    </style>
</head>

<body>
   <h3>Lorem, ipsum dolor.</h3>
   
</body>
           list-style-type: none; /* lstn */

</html>
