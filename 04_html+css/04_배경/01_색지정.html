!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>색지정</title>
    <style>
        
        body {background-color: transparent;}/* 투명 */
       
          
        /* 
        RGBa=RGB+alpha(투명도) 값 

        진법
        10진법(Decimal,데시멀)- 10진수 0~9
        2진법(Binary,바이너리)-2진수 0~1
        8진법(Octal,옥탈)-8진수 0~7
        16진법-16진수 0~9,A~F
        
        색 표현
        1.색상명 ->140개 영문 키워드
        2.HEX(hexadecimal,헥사데시멀 )값-> 16진수
        ->#RGB or #RRGGBB
        ->(ex)
        #ff000(red)
        #00ff00(lime)
        #008000(green)
        #0000ff(blue)
        #ffff00(yellow)
        #ff00ff(magenta)
        #00ffff(cyan)
        #000000(black)~#ffffff(white)
        #333333->#333
        #112233->#123
        #123456->3자로 표현 못함

            R: 0 ~ 255
            G: 0 ~ 255
            B: 0 ~ 255
            a: 0 ~ 1




            4.RGBa
            rgba(R,G,B,alpha)
            R: 0 ~ 255
            G: 0 ~ 255
            B: 0 ~ 255
            alpha: 0(투명) ~ 1(반투명)
            예, rgba(255,0,0,0.5)
        */
         /* https://www.w3schools.com/colors/colors_names.asp */
         /* 글자색의 기본색은 검정이다. */
        

         p {
            color: orange;
            background: rgba(247, 247, 130, 0.5);/* 0.5쓰고 앞에 a를 쓴다. */
            /* border 굵기의 기본값은 medium */
            /* border-width: 1px; */
            border-width: 1px;
            border-style: solid;
            /* border의 기본색은 글자색과 같다 */
            background-color: tomato;
            outline: 5px solid lime;
            text-shadow: 1px 1px 1px #ff0000;
            box-shadow: 1px 1px 1px 1px #000;
            box-shadow: 10px 10px 10px 10px #000;
         }


    </style>
</head>
<body>
    <h1>색 지정</h1>
    <p>글자 색, 배경 색, 테두리 색을 지정한다.</p>
</body>
</html>
