<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>불투명도</title>
    <style>
        P:nth-of-type(1) {color:rgb(241, 241, 108); 
            background:red;
            border:5px solid red;
            opacity: 0.5;/* 0.5에서 0은 생략가능 */
        }
        p:nth-of-type(2) {
            color:yellow;
            background: rgba(245, 106, 106,0.5);
            border:5px solid red;
        }

    </style>
</head>
<body>
    <h1>불투명도</h1>
    <p>opacity 값은 0~1이다</p>
    <p>글자색, 배경색, 테두리 색 등 모든 색에 한번에 불투명도를 적용하려면
        opacity속성을 사용한다.
    </p>
    <p>특정 속성에만 적용하려면 rgba (R,G,B,alpha)을 사용한다.</p>
    <p>rgba(R,G,B,alpah) 값은 0~1이다.</p>
</body>
</html>
