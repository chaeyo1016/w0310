<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML+CSS</title>
    <style>
/* 

display:화면에 표시되는 방식
 1.block
 -줄바꿈o
 -width는 부모width크기의 100%
 -height는 콘텐츠 크기
 -width와 height를 지정O
 -margin은 상하좌우 모두 적용

 2.inline
 -줄바꿈x
 -width와 height를 지정x
 -margin은 좌우만 적용
 3.inline-block
 -인라인이면서 블록 특징을 가진다
 -줄바꿈x
 -width는 부모width크기의 100%
 -height는 콘텐츠 크기
 -width와 height를 지정O
 -margin은 상하좌우 모두 적용

 4.none:없음 */

 div{  background: lightgreen;

}
     
    }
   

    /* display: inline; */
 }
    
     </style>
</head>
<body>
    div,span{
        border: 1px solid: #000;
    }
<div class="div1">div박스1</div>
<div class="div2">div박스2</div>
<div class="div3">div박스3</div>
<div class="div4">div박스4</div>

<span class="span1">span박스1</span>
<span class="span2">span박스2</span>
<span class="span3">span박스3</span>
<span class="span4">span박스4</span>


</body>
</html>
