<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>변수</title>
</head>
<body>
    <script>

       /* 

       데이터

       1.숫자(number):10
       2.문자열(string):'javascript' 
       3.불(Boolean):true, false -> 예약어(키워드)

       예약어(키워드):
       1. 논리값: true, false
       2. 변수 키워드: var,let,const,...
       3. 제어문: if, for, break, continue,....
       

       변수란? 테이터를 담는 저장공간
       변수 선언(variable) 키워드
       var


       var: let, const(엄격)
       var: 변수선언 키워드다

       변수 이름 정의
       1. 띄어쓰기 할수 없다: 한 단어로
       2. 첫 글자 영문자, _, $
       3. 두 번째 글자부터는 영문자, _, $, 숫자 조합
       4. 예약어는 변수명x
       5.



       

        */

        // 오른쪽의 데이터를 왼쪽 변수에 할당한다.
       num = 10;
       str = 'javascript';
       temp = true;

    // 1.여러 개의 변수를 ,로 연속하여 선언
    // var num1, str1, temp1; /* 변수 선언 */
    // num1 = 1000; /* 변수 할당 */

    // 2. 변수는 새로운 데이터가 저장되면 기존 데이터는 사라진다.


       console.log(num);
       console.log(str);
       console.log(temp)
    
    </script>
</body>
</html>
