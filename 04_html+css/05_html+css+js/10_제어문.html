<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제어문</title>
</head>
<body>
    <script>
        /* 

        문(statements)
        1. 선언문
        2. 실행문
        3. 제어문


        제어문-> 예약어
        1. 조건문: if, else, else if, switch
        2. 반복문: while, do while, for
        3. 기타: break, continue
        4. 선택문: switch
        
        의미:
        조건식 true이면 코드를 실행학, false이면 실행하지 않는다.

        
        */
    // if문-----------------------------------
    /* 
    형식2:
    if(조건식) {
       실행문1;
    else
    }
    */

    /* 
    
    객체는 속성과 메서드를 가지고 있다.
    속성은 객체의 특징
    메서드는 객체의 동작
    
    예) 현실세계
         승용차 객체
         - 속성: 바퀴 4개, 블랙, 이름,제조사
         - 메서드: 정지한다. 움직인다.

         예) 코드
         객체: window, document, location,....
         -속성: href
         -메서드: write(),alert()

         형식:
         객체.속성
         location.href(O)
         객체.메서드()
         document.write()

         함수(function, 기능):
         객체가 필요없는 메서드
         alert()
         
         */
        
        // 선언문
        var pw = 1234;
        var result = '잘못입력했습니다. 다시 한번 입력해 주세요';
        // 제어문
        if (pw > 1234) {
            // 실행문
            location.href = 'https:naver.com';/* 주소가 맞으면 웹사이트로 간다. */
            
            result(결과물)
            var:선언문
        }
        // sj:는 객체로 구성되어 있다.
        document의 자식이 html이다.
        alert은 함수라고도 부른다.메서드라고도 부른다.
    //  실행문
    window.alert(result);
    </script>
</body>
</html>
