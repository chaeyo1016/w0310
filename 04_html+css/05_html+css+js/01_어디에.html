<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자바스크립트의 적용위치</title>
    <!-- 외부 스타일 -->
     <link rel="stylesheet" href="스타일시트.css">
     <!-- 내부 스타일 -->
    <style></style>
    <script>
        // 한줄 주석: ctrl+/
        //  여러 줄 주석: ctrl+shift+a
        // 문장 끝에 ;를 쓴다.
        // 명령어의 대소문자 구별한다.
        
        
        // 경고창
        window.alert("자바스크립트 학습을 시작합니다.");
        // 문서출력
        document. write("자바스크립트 실행문");
        // 콘솔 로그
        console. log ("f12 누르면 볼수 있다");

        </script>
    <!-- 외부 스크립트: 재사용! -->
    <script src="외부스크립트.js"></script>
</head>
<!-- <body style="background:yellow;"> -->
    <!-- div를 클릭하면 alert()을 호출한다. -->
    <!-- onclick은 HTML의 이벤트 속성 -->
    
    <!-- 인라인 스크립트 -->
    <div onclick="alert('인라인 스크립트')";>박스</div>
    <!-- 내부 스크립트 -->
     <script>
        document.write("body 사이에 스크립트")
     </script>
</body>

</html>
