<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        ul{
            width: 200px;
            border: 1px solid #000;
        }
        .wrapping li{
            word-wrap: break-word;
            /* wwb */
        }
    </style>
</head>
<body>
    <ul>
     <li>
        <P>이름: 홍길동</P>
     </li>
     <LI>
        <p>이메일</p>
     </LI>
    <ul class="wrapping">
     <li>
        <P>이름: 홍길동</P>
     </li>

     <LI>
        <p>이메일</p>
     </LI>
    </ul>
</body>
</html>
