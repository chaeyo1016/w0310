<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* serif: 주로 인쇄물
            sans serif: 주로 웹에서 */
        p:nth-of-type(2) {
            font-family: serif;
            font-size: 20px;
            font-weight: 700;
            font-style: italic;
            line-height: 2em;
            letter-spacing: -1px;
            color: red;

            /* font:[굵기|기울림] 크기/줄간격 글꼴1,글꼴2,sans-serif; */
            /* 속성 값의 순서가 있다
            굴기, 기울임, 줄간경은 생략 가능 */
            font: 700 italic 20px/1.5 serif, sans-serif;
        }
    </style>
</head>
<body>
    <h1>제목</h1>
    <p><em>Lorem ipsum dolor sit amet consectetur adipisicing elit.</em> Mollitia, aliquid?</p>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Mollitia, aliquid?</p>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Mollitia, aliquid?</p>
</body>
</html>
