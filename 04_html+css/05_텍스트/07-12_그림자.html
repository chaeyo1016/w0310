    <style>
        /* 
        text-shadow: x위치 y위치 blur [색];
        x위치: 그림자가 원본에서 떨어지는 가로 거리
        y위치: 그림자가 원본에서 떨어지는 세로 거리
        색을 생략하면 글자색으로 지정된다 */
        /* 사례:애플 */
      h1{
        font-size: 40px;
        color: #fff;
        text-shadow: 2px 2px 10px rgba(0,0,0,0.5)    /* fz40 */
      }
     h2{
        font-size: 36px;
        font-weight: normal;
        color:#333;
        text-shadow: 1px 1px 2px rgba(0,0,0,0.1);        /* fwn */
     }
     h3{
        font-size: 40px;
        color: #ff5733;
        text-shadow: 1px 1px 2px rgba(0,0,0,0.5),0 0 25px  rgba(0,0,0,0.3) ,0 0 5px rgba()     /* fz40 */
     }
     h4{
        font-size: 40px;
        color:#fff;
        text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0,0, 15px #ff0000, 0 0 20px #ff0000;
         }
         button{
            font-size: 18px;
            color:#fff;
            background-color: #007bff;
            border: none;
            padding: 10px 20px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.3);
            dursor: pointer; 
            /* 손가락모양 나오게 하기 */
            /* bgc */
         }
    </style>
</head>
