<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML+CSS</title>
    <style>
        a{
            text-decoration: none; 
            /* tdn */
            color: crimson;
        }
        a:hover{
            text-decoration: underline;
            color: #333;

            /* tdu */
        }
        p{
            text-transform: capitalize;
            font: bold 25px Times;
            color: darkmagenta
            /* ttc */
        }
        span:first-of-type{
            text-decoration: underline;
        
        }
        span:first-of-type{
            text-decoration: overunderline;
        
        }
        span:first-of-type{
            text-decoration: underline;
        
        }
    </style>
</head>
<body>
    <ul>
        <li><a href="#">현재상영작</a></li>
        <li><a href="#">상영예정작</a></li>
    </ul>
    <span>밑줄</span>
    <span>윗줄</span>
    <span>취소선</span>
   
</body>
</html>
